[package]
name = "x-laptune"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
description = "Linux laptop hardware monitoring and control"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
ctrlc = { version = "3.5", features = ["termination"] }
libc = "0.2"
